[project]
name = "pharos"
version = "0.1.0"
description = "A lighthouse for your Linux configs: an AI helper that explains and safely edits them."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yashmit Vaish" }]
dependencies = [
    "httpx>=0.27",
    "rich>=13",
]

[project.scripts]
pharos = "pharos.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pharos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
